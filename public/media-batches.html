<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envio de Mídia em Lote - WhatsApp Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1><i class="fas fa-photo-video"></i> Gerenciador de Envios de Mídia</h1>
            <nav class="nav">
                <a href="index.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Voltar ao Dashboard
                </a>
            </nav>
        </div>
    </header>

    <section id="mediaBatchManagerSection" class="section active">
        <div class="container-full">
            <div class="main-content" style="width: 100%; margin: 0;">
                <div class="content-section active">
                    <div class="section-header">
                        <h2><i class="fas fa-images"></i> Lotes de Mídia Criados</h2>
                        <button class="btn btn-primary" id="newMediaBatchBtn">
                            <i class="fas fa-plus"></i> Novo Envio de Mídia
                        </button>
                    </div>
                    <div class="card">
                        <div id="mediaBatchesList" class="list-container">
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="loading" class="loading" style="display: none;"><div class="spinner"></div></div>
    <div id="notification" class="notification"></div>

    <script src="js/security.js"></script>
<script src="js/state-manager.js"></script>
<script src="js/theme-manager.js"></script>
<script src="js/components/list-component.js"></script>
<script src="js/media-batches.js"></script>
<script>
    // Inicialização garantida
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof app === 'undefined') {
            window.app = {};
        }
        app.mediaBatchesManager = new MediaBatchesManager(app);
        app.mediaBatchesManager.initEvents();
    });
</script>
<script src="js/app.js"></script>
</body>

</html>
