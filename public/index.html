<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Batch Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lato:wght@300;400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1><i class="fab fa-whatsapp"></i> WhatsApp Batch Manager</h1>
            <nav class="nav">
                <button id="logoutBtn" class="btn btn-secondary" style="display: none;">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </nav>
        </div>
    </header>

    <section id="loginSection" class="section active">
        <div class="container">
            <div class="login-card">
                <h2>Login</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Senha:</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Entrar
                    </button>
                </form>
                <p>Não tem conta? <a href="#" id="showRegister">Registrar</a></p>
            </div>

            <div class="login-card" id="registerCard" style="display: none;">
                <h2>Registrar</h2>
                <form id="registerForm">
                    <div class="form-group">
                        <label for="regName">Nome:</label>
                        <input type="text" id="regName" required>
                    </div>
                    <div class="form-group">
                        <label for="regEmail">Email:</label>
                        <input type="email" id="regEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="regPassword">Senha:</label>
                        <input type="password" id="regPassword" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Registrar
                    </button>
                </form>
                <p>Já tem conta? <a href="#" id="showLogin">Login</a></p>
            </div>
        </div>
    </section>

    <section id="dashboardSection" class="section">
        <div class="container">
            <div class="sidebar">
                <div class="user-info">
                    <h3 id="userName"></h3>
                    <p id="userEmail"></p>
                </div>

                <nav class="sidebar-nav">
                    <button class="nav-btn active" data-section="contactGroupsSection">
                        <i class="fas fa-users"></i> Grupos de Contatos
                    </button>
                    <button class="nav-btn" data-section="whatsappSection">
                        <i class="fab fa-whatsapp"></i> Instâncias WhatsApp
                    </button>
                    <button class="nav-btn" data-section="batchesSection">
                        <i class="fas fa-paper-plane"></i> Envios em Lote
                    </button>
                    <a href="media-batches.html" class="nav-btn">
                        <i class="fas fa-photo-video"></i> Envios de Mídia
                    </a>
                </nav>
            </div>

            <div class="main-content">
                <div id="contactGroupsSection" class="content-section active">
                    <div class="section-header">
                        <h2><i class="fas fa-users"></i> Grupos de Contatos</h2>
                        <button class="btn btn-primary" id="addGroupBtn">
                            <i class="fas fa-plus"></i> Novo Grupo
                        </button>
                    </div>
                    <div class="card">
                        <div id="groupsList" class="list-container"></div>
                    </div>
                </div>

                <div id="whatsappSection" class="content-section">
                    <div class="section-header">
                        <h2><i class="fab fa-whatsapp"></i> Instâncias WhatsApp</h2>
                        <button class="btn btn-primary" id="addInstanceBtn">
                            <i class="fas fa-plus"></i> Nova Instância
                        </button>
                    </div>
                    <div class="card">
                        <div id="instancesList" class="list-container"></div>
                    </div>
                </div>

                <div id="batchesSection" class="content-section">
                    <div class="section-header">
                        <h2><i class="fas fa-paper-plane"></i> Envios em Lote</h2>
                        <button class="btn btn-primary" id="addBatchBtn">
                            <i class="fas fa-plus"></i> Novo Envio
                        </button>
                    </div>
                    <div class="card">
                        <div id="batchesList" class="list-container"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="groupModal" class="modal"> </div>
    <div id="instanceModal" class="modal"> </div>
    <div id="qrcodeModal" class="modal"> </div>
    <div id="groupsModal" class="modal"> </div>
    
    <div id="loading" class="loading" style="display: none;"><div class="spinner"></div></div>
    <div id="notification" class="notification"></div>

    <script src="js/security.js"></script>
    <script src="js/state-manager.js"></script>
    <script src="js/theme-manager.js"></script>
    <script src="js/components/list-component.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
