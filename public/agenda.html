<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Contatos - WhatsApp Manager</title>
    <link rel="stylesheet" href="css/agenda.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header (integrado com seu sistema existente) -->
    <header class="header">
        <div class="header-content">
            <h1 class="logo">
                <i class="fas fa-address-book"></i>
                Agenda de Contatos
            </h1>
            <div class="user-menu">
                <span id="userName">Usuário</span>
                 <button id="voltarBtn" class="btn-voltar btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Voltar
                </button>
                <button id="logoutBtn" class="btn-logout btn btn-secondary">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
               

            </div>
        </div>
    </header>

    <!-- Navigation (integrada com seu sistema) -->
    <nav class="main-nav">
        <button class="nav-btn" data-section="contactsSection">
            <i class="fas fa-users"></i>
            Contatos
        </button>
        <button class="nav-btn" data-section="groupsSection">
            <i class="fas fa-layer-group"></i>
            Grupos
        </button>
        <button class="nav-btn" data-section="profileSection">
            <i class="fas fa-user-cog"></i>
            Meu Perfil
        </button>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Seção Contatos -->
        <section id="contactsSection" class="content-section active">
            <div class="section-header">
                <h2>Meus Contatos</h2>
                <div class="section-actions">
                    <button id="addContactBtn" class="btn btn-primary">
                        <i class="fas fa-plus"></i>
                        Novo Contato
                    </button>
                    <button id="importContactsBtn" class="btn btn-secondary">
                        <i class="fas fa-file-import"></i>
                        Importar
                    </button>
                </div>
            </div>

            <!-- Filtros e Busca -->
            <div class="filters-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchContacts" placeholder="Buscar contatos...">
                </div>
                <div class="filter-options">
                    <select id="filterGroup">
                        <option value="">Todos os Grupos</option>
                    </select>
                    <select id="sortContacts">
                        <option value="name">Ordenar por Nome</option>
                        <option value="recent">Mais Recentes</option>
                    </select>
                </div>
            </div>

            <!-- Lista de Contatos -->
            <div class="contacts-grid" id="contactsList">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Carregando contatos...</p>
                </div>
            </div>
        </section>

        <!-- Seção Grupos -->
        <section id="groupsSection" class="content-section">
            <div class="section-header">
                <h2>Grupos de Contatos</h2>
                <button id="createGroupBtn" class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    Novo Grupo
                </button>
            </div>
            <div class="groups-grid" id="groupsList">
                <!-- Grupos serão carregados aqui -->
            </div>
        </section>

        <!-- Seção Perfil -->
        <section id="profileSection" class="content-section">
            <div class="profile-container">
                <div class="profile-header">
                    <div class="profile-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <h2 id="profileName">Nome do Usuário</h2>
                    <p id="profileEmail">email@exemplo.com</p>
                </div>
                
                <div class="profile-stats">
                    <div class="stat-card">
                        <h3 id="totalContacts">0</h3>
                        <p>Contatos</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="totalGroups">0</h3>
                        <p>Grupos</p>
                    </div>
                    <div class="stat-card">
                        <h3 id="connectedInstances">0</h3>
                        <p>Instâncias</p>
                    </div>
                </div>

                <form class="profile-form" id="profileForm">
                    <div class="form-group">
                        <label for="userNameInput">Nome</label>
                        <input type="text" id="userNameInput" required>
                    </div>
                    <div class="form-group">
                        <label for="userEmailInput">Email</label>
                        <input type="email" id="userEmailInput" required>
                    </div>
                    <div class="form-group">
                        <label for="userPasswordInput">Nova Senha (opcional)</label>
                        <input type="password" id="userPasswordInput" placeholder="Deixe em branco para manter a atual">
                    </div>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>
                        Salvar Alterações
                    </button>
                </form>
            </div>
        </section>
    </main>

    <!-- Modais -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Adicionar Contato</h3>
                <button class="close">&times;</button>
            </div>
            <form id="contactForm" class="modal-form">
                <input type="hidden" id="contactId">
                
                <div class="form-group">
                    <label for="contactName">Nome *</label>
                    <input type="text" id="contactName" required>
                </div>
                
                <div class="form-group">
                    <label for="contactPhone">Telefone *</label>
                    <input type="tel" id="contactPhone" required placeholder="(11) 99999-9999">
                </div>
                
                <div class="form-group">
                    <label for="contactWhatsAppId">ID WhatsApp (opcional)</label>
                    <input type="text" id="contactWhatsAppId" placeholder="5511999999999@s.whatsapp.net">
                </div>
                
                <div class="form-group">
                    <label for="contactGroups">Grupos</label>
                    <select id="contactGroups" multiple>
                        <!-- Grupos serão carregados aqui -->
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="contactPhoto">Foto (URL)</label>
                    <input type="url" id="contactPhoto" placeholder="https://exemplo.com/foto.jpg">
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary modal-cancel">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Contato</button>
                </div>
            </form>
        </div>
    </div>

    <div id="groupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="groupModalTitle">Criar Grupo</h3>
                <button class="close">&times;</button>
            </div>
            <form id="groupForm" class="modal-form">
                <input type="hidden" id="groupId">
                
                <div class="form-group">
                    <label for="groupName">Nome do Grupo *</label>
                    <input type="text" id="groupName" required>
                </div>
                
                <div class="form-group">
                    <label for="groupDescription">Descrição</label>
                    <textarea id="groupDescription" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Selecionar Contatos</label>
                    <div class="contacts-selection" id="groupContactsSelection">
                        <!-- Lista de contatos para seleção -->
                    </div>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary modal-cancel">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Grupo</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading e Notificações (usando seus sistemas existentes) -->
    <div id="loading" class="loading" style="display: none;">
        <i class="fas fa-spinner fa-spin"></i>
        <span>Carregando...</span>
    </div>

    <div id="notification" class="notification" style="display: none;"></div>

    <!-- ORDEM CORRETA DE CARREGAMENTO -->
<script src="js/security.js"></script>
<script src="js/agenda.js"></script>

<script>
    // Inicialização independente da agenda
    document.addEventListener('DOMContentLoaded', function() {
        console.log('📍 Inicializando Agenda de forma independente...');
        
        // Criar auth mock compatível com localStorage
        const authMock = {
            getAuthHeaders: function() {
                const token = localStorage.getItem('authToken');
                return {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                };
            },
            showNotification: function(message, type) {
                const notification = document.getElementById('notification');
                if (notification) {
                    notification.textContent = message;
                    notification.className = `notification ${type}`;
                    notification.style.display = 'block';
                    setTimeout(() => {
                        notification.style.display = 'none';
                    }, 3000);
                }
            },
            showLoading: function() {
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'flex';
            },
            hideLoading: function() {
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'none';
            }
        };
        
        // Inicializar agenda
        window.agendaManager = new AgendaManager(authMock);
        
        if (!window.agendaManager.init()) {
            console.log('❌ Agenda não inicializada - redirecionando...');
        }

        const voltarBtn = document.getElementById('voltarBtn');
        if (voltarBtn) {
            voltarBtn.addEventListener('click', function() {
                window.location.href = 'index.html'; // Ajuste conforme necessário
            });
        }
    });
</script>

</body>
</html>
